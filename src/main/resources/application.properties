spring.application.name=waste-management

# ---------- MySQL ----------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- Server ----------
server.port=${PORT:8080}
server.servlet.context-path=/api

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ---------- File Upload ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=/tmp/uploads

# ---------- Frontend & Email ----------
app.frontend.url=${FRONTEND_URL}
app.email.enabled=false
app.email.from=noreply@wastems.example.com

spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=changeme
spring.mail.password=changeme
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.municipality.waste=INFO