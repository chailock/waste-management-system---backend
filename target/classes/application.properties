spring.application.name=waste-management

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/waste_management?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- Server ----------
server.port=8080
server.servlet.context-path=/api

# ---------- JWT ----------
app.jwt.secret=Y2hhbmdlLXRoaXMtc2VjcmV0LWtleS1mb3ItcHJvZHVjdGlvbi11c2Utb25seS1tdW5pY2lwYWxpdHk=
app.jwt.expiration-ms=86400000

# ---------- File Upload ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ---------- Email Notifications ----------
# Off by default so a fresh clone doesn't throw SMTP errors with no
# credentials configured. Set to true and fill in real SMTP details below
# to enable "new message" emails.
app.email.enabled=false
app.email.from=noreply@wastems.example.com
# Base URL the frontend is served from, used to build links inside emails.
app.frontend.url=http://localhost:3000

spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=changeme
spring.mail.password=changeme
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.municipality.waste=DEBUG
